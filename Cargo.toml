[package]
name = "s-crypt"
version = "0.7.0"
edition = "2024"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
tokio = { version = "1", features = ["full"] }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
zstd = "0.13"
tar = "0.4"
